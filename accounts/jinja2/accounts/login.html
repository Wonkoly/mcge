{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="mx-auto mt-24 max-w-sm rounded-xl border border-gray-200 bg-white p-6">
  <h1 class="text-lg font-semibold text-gray-900">Iniciar sesión</h1>
  {% if form.errors %}
    <p class="mt-3 text-sm text-red-600">Usuario o contraseña incorrectos.</p>
  {% endif %}
  <form method="post" class="mt-4 flex flex-col gap-3">
    {{ csrf_input() }}
    <div class="flex flex-col gap-1.5">
      <label for="id_username" class="text-sm font-medium text-gray-700">Usuario</label>
      <input id="id_username" type="text" name="username" autofocus required
             class="rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500">
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="id_password" class="text-sm font-medium text-gray-700">Contraseña</label>
      <input id="id_password" type="password" name="password" required
             class="rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="mt-2 w-full rounded-lg px-4 py-2 text-sm font-medium text-white" style="background-color: var(--color-brand-500);">
      Entrar
    </button>
  </form>
</div>
{% endblock %}
