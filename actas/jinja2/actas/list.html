{% extends "base.html" %}
{% block titulo %}Actas{% endblock %}
{% block contenido %}
  <div class="buscador-superior">
    <div>
      <h1>Actas de Junta Académica</h1>
    </div>
    <a href="{{ url_for('actas.nuevo') }}" class="btn">+ Nueva acta</a>
  </div>
  <div class="panel">
    <table>
      <thead><tr><th>Número</th><th>Fecha</th><th>Resumen</th></tr></thead>
      <tbody>
        {% for acta in actas %}
          <tr class="clicable" onclick="window.location='{{ url_for('actas.detalle', acta_id=acta.id) }}'">
            <td>{{ acta.numero }}</td>
            <td>{{ acta.fecha or "—" }}</td>
            <td>{{ acta.resumen or "—" }}</td>
          </tr>
        {% else %}
          <tr><td colspan="3" class="vacio">Sin actas capturadas.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
