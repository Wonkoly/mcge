{% extends "base.html" %}
{% block titulo %}Editar {{ alumno.nombre }}{% endblock %}
{% block contenido %}
  <p><a href="{{ url_for('alumnos.detalle', alumno_id=alumno.id) }}">&larr; Volver al expediente</a></p>
  <h1>Editar alumno</h1>
  <p class="subtitulo">{{ alumno.nombre }} — código {{ alumno.codigo }}</p>

  <form class="formulario" method="post">
    <div class="fila-campos">
      <div class="campo">
        <label>Código *</label>
        <input type="text" name="codigo" value="{{ alumno.codigo }}" required>
      </div>
      <div class="campo">
        <label>Nombre completo *</label>
        <input type="text" name="nombre" value="{{ alumno.nombre }}" required>
      </div>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label>Ciclo de ingreso</label>
        <input type="text" name="ciclo_ingreso" value="{{ alumno.ciclo_ingreso or '' }}">
      </div>
      <div class="campo">
        <label>Status</label>
        <select name="status_codigo">
          <option value="">—</option>
          {% for s in status_list %}
            <option value="{{ s.codigo }}" {{ "selected" if alumno.status_codigo == s.codigo else "" }}>{{ s.nombre }} ({{ s.codigo }})</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label>Créditos acumulados</label>
        <input type="number" name="creditos_acumulados" value="{{ alumno.creditos_acumulados if alumno.creditos_acumulados is not none else '' }}">
      </div>
      <div class="campo">
        <label>Créditos faltantes</label>
        <input type="number" name="creditos_faltantes" value="{{ alumno.creditos_faltantes if alumno.creditos_faltantes is not none else '' }}">
      </div>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label>Promedio</label>
        <input type="number" step="0.01" name="promedio" value="{{ alumno.promedio if alumno.promedio is not none else '' }}">
      </div>
      <div class="campo">
        <label>Ciclos cursados</label>
        <input type="number" name="ciclos_cursados" value="{{ alumno.ciclos_cursados if alumno.ciclos_cursados is not none else '' }}">
      </div>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label>Correo personal</label>
        <input type="email" name="correo_personal" value="{{ alumno.correo_personal or '' }}">
      </div>
      <div class="campo">
        <label>Correo institucional</label>
        <input type="email" name="correo_institucional" value="{{ alumno.correo_institucional or '' }}">
      </div>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label>Teléfono</label>
        <input type="text" name="telefono" value="{{ alumno.telefono or '' }}">
      </div>
      <div class="campo">
        <label>CVU</label>
        <input type="text" name="cvu" value="{{ alumno.cvu or '' }}">
      </div>
    </div>

    <div class="campo">
      <label>LIES</label>
      <select name="lies_id">
        <option value="">—</option>
        {% for l in lies_list %}
          <option value="{{ l.id }}" {{ "selected" if alumno.lies_id == l.id else "" }}>{{ l.nombre }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="campo">
      <label>Título de tesis</label>
      <input type="text" name="tesis_titulo" value="{{ alumno.tesis_titulo or '' }}">
    </div>

    <div class="campo">
      <label>Observaciones</label>
      <textarea name="observaciones" rows="3">{{ alumno.observaciones or '' }}</textarea>
    </div>

    <div class="acciones-form">
      <button class="btn" type="submit">Guardar cambios</button>
      <a class="btn btn-secundario" href="{{ url_for('alumnos.detalle', alumno_id=alumno.id) }}">Cancelar</a>
    </div>
  </form>
{% endblock %}
