{% extends "base.html" %}
{% block titulo %}Alumnos{% endblock %}
{% block contenido %}
  <div class="buscador-superior">
    <div>
      <h1>Alumnos</h1>
    </div>
    <a href="{{ url_for('alumnos.nuevo') }}" class="btn">+ Agregar alumno</a>
  </div>

  <form class="barra-busqueda fila-campos" method="get"
        hx-get="{{ url_for('alumnos.listar') }}"
        hx-target="#alumnos-resultado"
        hx-trigger="keyup changed delay:300ms, change"
        hx-push-url="true">
    <input type="text" name="q" value="{{ filtros.texto }}" placeholder="Buscar por nombre o código...">

    <select name="ciclo_ingreso">
      <option value="">— Ciclo de ingreso (todos)</option>
      {% for c in ciclo_opciones %}<option value="{{ c }}" {{ "selected" if filtros.ciclo_ingreso == c else "" }}>{{ c }}</option>{% endfor %}
    </select>

    <select name="status_codigo">
      <option value="">— Status (todos)</option>
      {% for s in status_list %}<option value="{{ s.codigo }}" {{ "selected" if filtros.status_codigo == s.codigo else "" }}>{{ s.nombre }}</option>{% endfor %}
    </select>

    <select name="categoria">
      <option value="">— Categoría (todas)</option>
      <option value="activo" {{ "selected" if filtros.categoria == "activo" else "" }}>Activos</option>
      <option value="proceso_titulacion" {{ "selected" if filtros.categoria == "proceso_titulacion" else "" }}>Proceso de Titulación</option>
      <option value="graduado" {{ "selected" if filtros.categoria == "graduado" else "" }}>Graduados</option>
      <option value="titulado" {{ "selected" if filtros.categoria == "titulado" else "" }}>Titulados</option>
      <option value="baja" {{ "selected" if filtros.categoria == "baja" else "" }}>Bajas</option>
      <option value="inactivo" {{ "selected" if filtros.categoria == "inactivo" else "" }}>Inactivos</option>
    </select>

    <select name="lies_id">
      <option value="">— LIES (todas)</option>
      {% for l in lies_list %}<option value="{{ l.id }}" {{ "selected" if filtros.lies_id == l.id|string else "" }}>{{ l.nombre }}</option>{% endfor %}
    </select>

    <select name="director_id">
      <option value="">— Director (todos)</option>
      {% for p in directores %}<option value="{{ p.id }}" {{ "selected" if filtros.director_id == p.id|string else "" }}>{{ p.nombre }}</option>{% endfor %}
    </select>

    <select name="dictamen">
      <option value="">— Dictamen (todos)</option>
      {% for d in dictamen_opciones %}<option value="{{ d }}" {{ "selected" if filtros.dictamen == d else "" }}>{{ d }}</option>{% endfor %}
    </select>

    <input type="number" name="creditos_min" value="{{ filtros.creditos_min }}" placeholder="Créditos mín." style="max-width:130px;">
    <input type="number" name="creditos_max" value="{{ filtros.creditos_max }}" placeholder="Créditos máx." style="max-width:130px;">

    <input type="hidden" name="orden" value="{{ filtros.orden }}">
    <button class="btn btn-secundario" type="submit">Buscar</button>
  </form>

  <div id="alumnos-resultado">
    {% include "alumnos/_tabla.html" %}
  </div>
{% endblock %}
