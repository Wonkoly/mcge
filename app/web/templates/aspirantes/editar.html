{% extends "base.html" %}
{% block titulo %}Editar {{ aspirante.nombre }}{% endblock %}
{% block contenido %}
  <p><a href="{{ url_for('aspirantes.listar') }}">&larr; Volver a aspirantes</a></p>
  <h1>Editar aspirante</h1>

  <form class="formulario" method="post">
    <div class="campo">
      <label>Nombre completo *</label>
      <input type="text" name="nombre" value="{{ aspirante.nombre }}" required>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label>Licenciatura</label>
        <input type="text" name="licenciatura" value="{{ aspirante.licenciatura or '' }}">
      </div>
      <div class="campo">
        <label>Universidad de procedencia</label>
        <input type="text" name="universidad" value="{{ aspirante.universidad or '' }}">
      </div>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label>Promedio</label>
        <input type="number" step="0.01" name="promedio" value="{{ aspirante.promedio if aspirante.promedio is not none else '' }}">
      </div>
      <div class="campo">
        <label>Ciclo al que aplica</label>
        <input type="text" name="ciclo" value="{{ aspirante.ciclo or '' }}">
      </div>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label>Correo</label>
        <input type="email" name="correo" value="{{ aspirante.correo or '' }}">
      </div>
      <div class="campo">
        <label>Teléfono</label>
        <input type="text" name="telefono" value="{{ aspirante.telefono or '' }}">
      </div>
    </div>

    <div class="campo">
      <label>Estado</label>
      <select name="estado">
        {% for e in estados %}
          <option value="{{ e }}" {{ "selected" if aspirante.estado == e else "" }}>{{ e }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="campo">
      <label>Observaciones</label>
      <textarea name="observaciones" rows="3">{{ aspirante.observaciones or '' }}</textarea>
    </div>

    <div class="acciones-form">
      <button class="btn" type="submit">Guardar cambios</button>
      <a class="btn btn-secundario" href="{{ url_for('aspirantes.listar') }}">Cancelar</a>
    </div>
  </form>
{% endblock %}
